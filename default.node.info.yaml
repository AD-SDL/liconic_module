node_name: default.node
node_id: 01K8C21HMA4JD5T4CS5W25VF3R
node_description: null
node_type: device
module_name: liconic_rest_node
module_version: 0.0.1
capabilities:
  get_info: true
  get_state: true
  get_status: true
  send_action: true
  get_action_result: true
  get_action_history: true
  action_files: true
  send_admin_commands: true
  set_config: true
  get_resources: false
  get_log: true
  admin_commands:
  - lock
  - reset
  - shutdown
  - unlock
node_url: null
actions:
  set_target_temp:
    name: set_target_temp
    description: Set the target temperature of the incubator
    args:
      temp:
        name: temp
        description: target temperature
        argument_type: float
        required: true
        default: null
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
  set_target_humidity:
    name: set_target_humidity
    description: Set the target humidity of the incubator
    args:
      humidity:
        name: humidity
        description: target humidity
        argument_type: float
        required: true
        default: null
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
  begin_shake:
    name: begin_shake
    description: Begin shaking the incubator at the specified speed
    args:
      shaker_id:
        name: shaker_id
        description: shaker id (shaker 1 = stacks 1 and 2, shaker 2 = stacks 3 and
          4 , or None for both shakers)
        argument_type: int
        required: false
        default: null
      shaker_speed:
        name: shaker_speed
        description: shaker speed (1-50 valid, default 20 = 200rpm)
        argument_type: int
        required: false
        default: 20
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
  end_shake:
    name: end_shake
    description: Stop shaking the incubator
    args:
      shaker_id:
        name: shaker_id
        description: shaker id (shaker 1 = stacks 1 and 2, shaker 2 = stacks 3 and
          4 , or None for both shakers)
        argument_type: int
        required: false
        default: null
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
  load_plate:
    name: load_plate
    description: Load a plate into the incubator
    args:
      plate_type:
        name: plate_type
        description: plate type (flat_bottom_96well, deep_96well, etc.)
        argument_type: str
        required: true
        default: null
      plate_id:
        name: plate_id
        description: plate id
        argument_type: str
        required: false
        default: null
      stack:
        name: stack
        description: stack number (1-4), must also specify slot
        argument_type: int
        required: false
        default: null
      slot:
        name: slot
        description: slot number (1-22 for stacks 1 and 2, 1-10 for stacks 3 and 4,
          must also specify stack)
        argument_type: int
        required: false
        default: null
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
  unload_plate:
    name: unload_plate
    description: Unload a plate from the incubator
    args:
      plate_id:
        name: plate_id
        description: plate id
        argument_type: str
        required: false
        default: null
      stack:
        name: stack
        description: stacker number (1-4)
        argument_type: int
        required: false
        default: null
      slot:
        name: slot
        description: slot number (1-22 for stacks 1 and 2, 1-10 for stacks 3 and 4)
        argument_type: int
        required: false
        default: null
    locations: {}
    files: {}
    results: {}
    blocking: false
    asynchronous: true
config:
  node_definition: default.node.yaml
  node_info_path: null
  update_node_files: true
  status_update_interval: 2.0
  state_update_interval: 2.0
  node_url: http://hudson01.cels.anl.gov:2005
  uvicorn_kwargs: {}
  liconic_driver_port: 3333
  liconic_driver_host: localhost
  liconic_driver_cassette_config: C:\Liconic\stxdriver_64bit\DriverConfig\Devices\CassettesConfig1.xml
  resources_path: C:\Users\svcaibio\.madsci\liconic\liconic_resources.yaml
config_schema:
  description: Configuration for the Liconic REST node
  properties:
    node_definition:
      anyOf:
      - type: string
      - format: path
        type: string
      - type: 'null'
      default: default.node.yaml
      description: Path to the node definition file to use. If set, the node will
        load the definition from this file on startup. Otherwise, a default configuration
        will be created.
      title: Node Definition File
    node_info_path:
      anyOf:
      - type: string
      - format: path
        type: string
      - type: 'null'
      default: null
      description: Path to export the generated node info file. If not set, will use
        the node name and the node_definition's path.
      title: Node Info Path
    update_node_files:
      default: true
      description: Whether to update the node definition and info files on startup.
        If set to False, the node will not update the files even if they are out of
        date.
      title: Update Node Files
      type: boolean
    status_update_interval:
      anyOf:
      - type: number
      - type: 'null'
      default: 2.0
      description: The interval in seconds at which the node should update its status.
      title: Status Update Interval
    state_update_interval:
      anyOf:
      - type: number
      - type: 'null'
      default: 2.0
      description: The interval in seconds at which the node should update its state.
      title: State Update Interval
    node_url:
      default: http://hudson01.cels.anl.gov:2005
      title: Node Url
      type: string
    uvicorn_kwargs:
      additionalProperties: true
      description: Configuration for the Uvicorn server that runs the REST API.
      title: Uvicorn Configuration
      type: object
    liconic_driver_port:
      default: 3333
      title: Liconic Driver Port
      type: integer
    liconic_driver_host:
      default: localhost
      title: Liconic Driver Host
      type: string
    liconic_driver_cassette_config:
      default: C:\Liconic\stxdriver_64bit\DriverConfig\Devices\CassettesConfig1.xml
      title: Liconic Driver Cassette Config
      type: string
    resources_path:
      default: C:\Users\svcaibio\.madsci\liconic\liconic_resources.yaml
      format: path
      title: Resources Path
      type: string
  title: LiconicNodeConfig
  type: object
